services:
  worker:
    build: .
    container_name: btc-wallet-worker
    restart: unless-stopped
    command: ["generate-forever"]

    environment:
      DB_PATH: ${DB_PATH:-/data/wallet.db}
      MEMPOOL_API_BASE: ${MEMPOOL_API_BASE:-https://mempool.space/api}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
      GENERATE_INTERVAL_SECONDS: ${GENERATE_INTERVAL_SECONDS:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MASTER_PASSWORD_FILE: /run/secrets/master_password

    volumes:
      - ./data:/data

    secrets:
      - master_password

    healthcheck:
      test: ["CMD", "btc-wallet-monitor", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

secrets:
  master_password:
    file: ./secrets/master_password
